[package]
name = "mizar-lsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "mizar_lsp"
path = "src/lib.rs"

[[bin]]
name = "mizar"
path = "src/main.rs"

[dependencies]
blake3 = "1"
mizar-artifact = { path = "../mizar-artifact" }
mizar-build = { path = "../mizar-build" }
mizar-diagnostics = { path = "../mizar-diagnostics" }
mizar-driver = { path = "../mizar-driver" }
mizar-ir = { path = "../mizar-ir" }
mizar-lexer = { path = "../mizar-lexer" }
mizar-session = { path = "../mizar-session" }
serde_json = "1"

[dev-dependencies]
mizar-atp = { path = "../mizar-atp" }
