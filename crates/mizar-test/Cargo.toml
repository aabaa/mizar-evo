[package]
name = "mizar-test"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mizar_test"
path = "src/lib.rs"

[dependencies]
mizar-checker = { path = "../mizar-checker" }
mizar-core = { path = "../mizar-core" }
mizar-frontend = { path = "../mizar-frontend" }
mizar-lexer = { path = "../mizar-lexer" }
mizar-proof = { path = "../mizar-proof" }
mizar-resolve = { path = "../mizar-resolve" }
mizar-session = { path = "../mizar-session" }
mizar-syntax = { path = "../mizar-syntax" }
mizar-vc = { path = "../mizar-vc" }

[dev-dependencies]
mizar-doc = { path = "../mizar-doc" }
mizar-atp = { path = "../mizar-atp" }
mizar-artifact = { path = "../mizar-artifact" }
mizar-kernel = { path = "../mizar-kernel" }
syn = { version = "2.0.117", features = ["full", "visit"] }

[lints]
workspace = true

[[bin]]
name = "mizar-test"
path = "src/main.rs"
